<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfd6ff">
<meta name="robots" content="noindex">
<title>Magical Outlet · Manutenzione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=42">
<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:2px dashed #c9cdf0}
.chk:first-of-type{border-top:0}
.ic{flex:0 0 30px;height:30px;border:3px solid var(--ink);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;background:var(--soft)}
.ic.ok{background:#6fe0a3}.ic.ko{background:#ff7a59}.ic.wait{background:var(--yel)}
textarea.code{width:100%;min-height:220px;font:700 13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:3px solid var(--ink);border-radius:14px;padding:10px;box-sizing:border-box;background:#fff;color:var(--ink)}
.gm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:2px dashed #c9cdf0}
.gm:first-of-type{border-top:0}
.gm .code{font:400 26px/1 "Lilita One",sans-serif;letter-spacing:.06em}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:12px;display:block}
.steps{margin:6px 0 0;padding-left:22px;font-weight:700}
.steps li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap stack" id="app"><p>Caricamento…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js?v=42"></script>
<script src="core.js?v=42"></script>
<script src="admin.js?v=42"></script>
</body>
</html>
